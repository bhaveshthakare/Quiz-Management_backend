# ===================== Quiz Platform Backend =====================
spring.application.name=quiz-backend

# ---------- Database (Aiven MySQL / local) ----------
# For Aiven: jdbc:mysql://host:port/database?useSSL=true&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-java-bhaveshthakare642-2efe.e.aivencloud.com:25511/rutudb?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:bhavesh}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Connection pool (tuned for managed MySQL like Aiven:
# servers close idle connections quickly, so keep max-lifetime short) ----------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:quiz-platform-dev-secret-key-change-me-in-production-2026!!}
app.jwt.expiration=${JWT_EXPIRATION:604800000}
app.jwt.issuer=quiz-platform

# ---------- CORS / Frontend ----------
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ---------- Default Admin (created automatically on first start) ----------
app.admin.email=${ADMIN_EMAIL:admin@quizplatform.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:Platform Admin}

# ---------- Mail (SMTP, e.g. Gmail app password / SendGrid) ----------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Server ----------
server.port=${PORT:8081}
server.error.include-message=never

# ---------- File upload (CSV/Excel question import) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------- Certificate storage ----------
app.certificate-dir=${CERTIFICATE_DIR:./certificates}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never