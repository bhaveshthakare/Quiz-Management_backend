# ===================== Quiz Platform Backend =====================
spring.application.name=quiz-backend

# Secrets are read from the .env file next to the project (gitignored) or from
# environment variables. Keep .env out of git - nothing sensitive is stored here.

# ---------- Database (managed MySQL e.g. Aiven / local) ----------
# Loads KEY=VALUE pairs from ./.env when present; platform environment variables
# work too, so a local .env is not required on deployed environments.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Connection pool (tuned for managed MySQL like Aiven:
# servers close idle connections quickly, so recycle them fast) ----------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=45000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:604800000}
app.jwt.issuer=quiz-platform

# ---------- CORS / Frontend ----------
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ---------- Default Admin (created automatically on first start) ----------
app.admin.email=${ADMIN_EMAIL:admin@quizplatform.com}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Platform Admin}

# ---------- Mail (SMTP, e.g. Gmail app password / SendGrid) ----------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Server ----------
server.port=${PORT:8082}
server.error.include-message=never

# ---------- File upload (CSV/Excel question import) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------- Certificate storage ----------
app.certificate-dir=${CERTIFICATE_DIR:./certificates}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# SMTP is optional; without credentials the mail health check would fail and
# pollute logs / break Render health checks.
management.health.mail.enabled=false
